spring:
  jpa:
    hibernate:
      ddl-auto: none
      dialect: org.hibernate.dialect.PostgreSQL82Dialect
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5434/order_db
    username: root
    password: root
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: 8083
