server:
  port: 8080
spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: product-service
            uri: lb://product-service
            predicates:
              - Path=/api/products/**
          - id: inventory-service
            uri: lb://inventory-service
            predicates:
              - Path=/api/inventory/**
          - id: order-service
            uri: lb://order-service
            predicates:
              - Path=/api/orders/**
